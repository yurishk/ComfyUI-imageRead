[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-image-manager"
version = "1.2.0"
description = "An advanced ComfyUI image loader with managed libraries, bounded recursive folder browsing, image editing, and mask output"
authors = [
  {name = "yurishk"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.19.0",
  "Pillow>=8.0.0",
]
classifiers = [
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/yurishk/ComfyUI-imageRead"
"Bug Tracker" = "https://github.com/yurishk/ComfyUI-imageRead/issues"

[tool.comfy]
PublisherId = "yurishk"
DisplayName = "Advanced Image Loader"
Icon = "https://raw.githubusercontent.com/yurishk/ComfyUI-imageRead/main/pic/ReferenceImageManager-preview.png"

[tool.setuptools.package-data]
"*" = ["*.*"]
